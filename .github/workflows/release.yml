name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Serializes runs so two merges landing close together can't race to force-update the same release pull
# request branch (a later-finishing-but-stale run could otherwise silently drop a commit from the release).
# Never cancels an in-progress run — letting one finish before the next starts is what avoids the race, and
# the queued run still re-reads live GitHub state, so it won't miss whatever the cancelled run would have seen.
concurrency:
  group: release-svp-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned to a published version so every run uses the exact same tested artifact, not whatever
      # happens to be on `main` at push time. Bump this after each release (a normal commit, tracked like
      # any other unreleased change).

      # Tags + creates a GitHub Release if the push just merged a release pull request.
      - name: Release
        run: npx --yes release-svp@0.1.0 release --repo-url ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --release-type node

      # Opens/updates the pull request for the *next* release, reflecting anything merged since.
      - name: Prepare
        run: npx --yes release-svp@0.1.0 prepare --repo-url ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --release-type node
