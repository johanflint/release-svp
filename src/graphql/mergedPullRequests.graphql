# Used (among other things) by determineReleases.ts to find this component's still-pending release pull
# requests. Ordering doesn't affect correctness there — every merged pull request for the branch is scanned, no
# early exit — but UPDATED_AT keeps recently-active pull requests near the front, which is a reasonable default
# for anything else iterating this same query (e.g. inspecting recent activity in log output).
query mergedPullRequests($owner: String!, $repo: String!, $count: Int!, $targetBranch: String!, $states: [PullRequestState!], $cursor: String) {
    repository(owner: $owner, name: $repo) {
        pullRequests(first: $count, after: $cursor, baseRefName: $targetBranch, states: $states, orderBy: {field: UPDATED_AT, direction: DESC}) {
            nodes {
                number
                title
                baseRefName
                headRefName
                labels(first: 10) {
                    nodes {
                        name
                    }
                }
                body
                mergeCommit {
                    oid
                }
                files(first: 100) {
                    nodes {
                        path
                    }
                    pageInfo {
                        hasNextPage
                        endCursor
                    }
                }
            }
            pageInfo {
                endCursor
                hasNextPage
            }
        }
    }
}