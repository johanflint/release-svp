query pullRequestFiles($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
    repository(owner: $owner, name: $repo) {
        pullRequest(number: $number) {
            files(first: 100, after: $cursor) {
                nodes {
                    path
                }
                pageInfo {
                    hasNextPage
                    endCursor
                }
            }
        }
    }
}
